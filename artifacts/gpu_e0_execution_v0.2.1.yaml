# Execution freeze only. Does not rewrite Experimental Contract v0.2.
# DESIGN / PROTOCOL LOCK. This file does not authorize VLM/LoRA/RM/DPO/GRPO.

version: v0.2.1
document_id: GPU_E0_EXECUTION_ADDENDUM
status: FROZEN
frozen_at: "2026-09-11"
type: execution_addendum
not_a_new_experimental_contract: true

does_not_modify:
  - FIT-Clean v0.1
  - Experimental Contract v0.1
  - Experimental Contract v0.2
  - artifacts/gpu_e0_pilot_v0.2.yaml
  - artifacts/experimental_contract_v0.2.yaml
  - artifacts/control_variable_matrix_v0.2.yaml
  - artifacts/controlled_fit_ladder_schema_v0.2.yaml

human_readable: docs/GPU_E0_EXECUTION_ADDENDUM_v0.2.1.md


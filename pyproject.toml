[project]
name = "fitground"
version = "0.1.0"
description = "Measurement-grounded audit pipeline for FIT 100K"
requires-python = ">=3.11"
dependencies = [
  "datasets>=3.0",
  "huggingface-hub>=0.30",
  "imagehash>=4.3",
  "matplotlib>=3.8",
  "numpy>=1.26",
  "pandas>=2.2",
  "pillow>=10.0",
  "pyarrow>=15.0",
  "requests>=2.31",
  "scipy>=1.11",
  "seaborn>=0.13",
  "tqdm>=4.66",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.10",
  "pytest>=8.0",
  "ruff>=0.6",
  "types-requests>=2.31",
]

[project.scripts]
fitground-audit = "fitground.audit:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["fitground"]
